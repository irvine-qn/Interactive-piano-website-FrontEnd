<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>

    <style>
      body, html { 
        margin: 0; 
        padding: 0; 
        height: 100%; 
        background: #ffffff; /* background colour */
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
      }
      
      .loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; 
        height: 100vh; 
        gap: 20px; 
      }

      /* The circular box defines the animation area */
      .animation-box {
        position: relative;
        width: 350px;  
        height: 350px;
        overflow: hidden; 
        border-radius: 50%; 
        background-color: #0ca3e8; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);  
      }

      /* The base for the image layers is located inside the box */
      .layer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-repeat: no-repeat;
      }

      /* Layer 3: background */
      .layer-bg {
        background-image: url('/layer_3_background.jpg');
        z-index: 1;
        background-size: cover; 
        background-position: bottom center;
      }

      /* Layer 2: Clouds */
      .layer-clouds {
        background-image: url('/layer_2.png');
        z-index: 2;
        width: 200%;
        background-size: 130% auto;
        background-position: top center; 
        background-repeat: repeat-x;
        will-change: transform;
        animation: driftClouds 20s linear infinite;
      }

      /* Layer 1: Fox */
      .layer-fox {
        background-image: url('/layer_1.png');
        z-index: 3;
        background-size: auto 100%; 
        background-position: bottom center;
      }

      /* Text Loading */
      .loading-container {
        font-size: 1.5rem;
        font-weight: bold;
        color: #F06400; 
      }

      .dot {
        display: inline-block;
        margin-left: 2px;
        animation: bounce 1.4s infinite ease-in-out both;
      }
      .dot:nth-child(1) { animation-delay: -0.32s; }
      .dot:nth-child(2) { animation-delay: -0.16s; }

      @keyframes driftClouds {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-8px); }
      }

    </style>
  </head>

  <body>
    <div id="root">

      <div class="loader-wrapper">
        <!-- The circular box defines the animation area -->
        <div class="animation-box">
          <div class="layer layer-bg"></div>
          <div class="layer layer-clouds"></div>
          <div class="layer layer-fox"></div>
        </div>

        <!-- Text Loading -->
        <div class="loading-container">
          Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>

</html>
